<!DOCTYPE html>
<html lang="nb" data-phase="calm">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Friminutt-timer</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Bricolage+Grotesque:opsz,wght@12..96,500..800&display=swap">
<style>
:root{
  /* Layout: widget som fyller boksen den ligger i (iframe i Classroomscreen). Ring med tid i midten, kontrollinje nederst, innstillinger som eget ark over widgeten. Alt skalerer med boksens korteste side. */
  --sky:#E4EEF8;
  --ink:#0F2340;
  --blue:#2A5BD7;
  --amber:#E07B00;
  --red:#C4213B;
  --paper:#FFFFFF;
  --font-display:"Bricolage Grotesque","Segoe UI",system-ui,-apple-system,sans-serif;
  --font-body:"Atkinson Hyperlegible","Segoe UI",system-ui,-apple-system,sans-serif;

  --line:color-mix(in srgb, var(--ink) 16%, var(--paper));
  --wash:color-mix(in srgb, var(--ink) 6%, var(--paper));
  --soft-ink:color-mix(in srgb, var(--ink) 72%, var(--paper));

  --bg:var(--sky);
  --fg:var(--ink);
  --arc:var(--blue);
  --track:color-mix(in srgb, var(--ink) 10%, transparent);
  --muted:var(--soft-ink);

  --btn-h:clamp(30px, 9.5vmin, 52px);
  --bar-pad:clamp(4px, 1.1vmin, 8px);
  --bar-bottom:clamp(8px, 2.4vmin, 22px);
  --edge:clamp(6px, 2.5vmin, 24px);
  color-scheme:light;
}
:root[data-phase="warn"]{
  --bg:#FFF1D6;
  --fg:#3A2300;
  --arc:var(--amber);
  --track:rgba(58,35,0,.12);
  --muted:#7A5520;
}
:root[data-phase="over"]{
  --bg:var(--red);
  --fg:#FFFFFF;
  --arc:#FFFFFF;
  --track:rgba(255,255,255,.24);
  --muted:rgba(255,255,255,.86);
}

*{box-sizing:border-box}
[hidden]{display:none !important}
html,body{height:100%;margin:0}
html{background:var(--bg);transition:background-color .6s ease}
body{
  background:var(--bg);color:var(--fg);
  font-family:var(--font-body);
  overflow:hidden;
  transition:background-color .6s ease,color .6s ease;
}
:focus-visible{outline:3px solid var(--blue);outline-offset:2px}

.app{position:relative;height:100%}

/* Ringen */
.dial-wrap{
  position:absolute;inset:0;
  container-type:size;
  display:grid;place-items:center;
  padding:var(--edge);
  transition:padding .35s ease;
}
.app[data-state="idle"] .dial-wrap{
  padding-bottom:calc(var(--btn-h) + 2 * var(--bar-pad) + 2 * var(--bar-bottom));
}
.dial{position:relative;width:min(100cqw,100cqh);aspect-ratio:1;container-type:inline-size}
.app[data-state="idle"] .dial{cursor:pointer}
.dial svg{position:absolute;inset:0;width:100%;height:100%;transform:rotate(-90deg)}
.track{fill:none;stroke:var(--track);stroke-width:7;transition:stroke .6s ease}
.arc{fill:none;stroke:var(--arc);stroke-width:7;stroke-linecap:round;transition:stroke .6s ease,opacity .3s ease}
.app[data-state="paused"] .arc{opacity:.4}

.readout{
  position:absolute;inset:0;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:1.4cqw;text-align:center;padding:0 12cqw;
}
.title{
  max-width:64cqw;
  font-family:var(--font-display);font-weight:700;
  font-size:6.5cqw;line-height:1.15;
  color:var(--muted);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  margin-bottom:.6cqw;
}
:root[data-phase="over"] .title{display:none}
.digits{
  font-family:var(--font-display);font-weight:800;
  font-size:24cqw;line-height:.9;
  font-variation-settings:"opsz" 96;
  white-space:nowrap;
}
.digits.long{font-size:17cqw}
.digits .d{display:inline-block;width:.62em;text-align:center}
.digits .c{display:inline-block;width:.3em;text-align:center;transform:translateY(-.07em)}
.pre,.post{
  display:none;
  font-family:var(--font-display);font-weight:700;
  font-size:8.5cqw;line-height:1;
}
:root[data-phase="over"] .pre,
:root[data-phase="over"] .post{display:block}
.sub{
  margin-top:2.2cqw;
  font-size:4.8cqw;font-weight:700;
  color:var(--muted);
  font-variant-numeric:tabular-nums;
}

@keyframes tick{from{transform:scale(1.08)}to{transform:scale(1)}}
.digits.pulse{animation:tick .55s ease-out}
@keyframes blink{50%{opacity:.35}}
.app[data-state="paused"] .digits{animation:blink 1.6s ease-in-out infinite}

/* Kontrollinje */
.bar{
  position:absolute;left:50%;bottom:var(--bar-bottom);
  transform:translateX(-50%);
  display:flex;gap:clamp(2px,.8vmin,6px);
  max-width:calc(100% - 2 * var(--edge));
  padding:var(--bar-pad);
  background:var(--paper);color:var(--ink);
  border-radius:clamp(10px,3vmin,18px);
  box-shadow:0 1px 2px rgba(0,0,0,.08),0 8px 24px rgba(0,0,0,.16);
  transition:opacity .35s ease,transform .35s ease;
  z-index:5;
}
.app.hide-ui .bar{opacity:0;transform:translate(-50%,10px);pointer-events:none}
.app.hide-ui{cursor:none}
.app[data-state="idle"] .only-run{display:none}
.app:not([data-state="idle"]) .only-idle{display:none}
.bar button{
  display:flex;align-items:center;justify-content:center;gap:clamp(4px,1.2vmin,8px);
  height:var(--btn-h);min-width:var(--btn-h);
  padding:0 clamp(8px,2.4vmin,16px);
  border:0;border-radius:clamp(7px,2vmin,12px);
  background:transparent;color:var(--ink);
  font:inherit;font-weight:700;font-size:clamp(12px,3.4vmin,17px);
  white-space:nowrap;cursor:pointer;
}
.bar button.icon{padding:0}
.bar button:hover{background:var(--wash)}
.bar button.main{background:var(--blue);color:#fff;padding:0 clamp(12px,3.6vmin,22px)}
.bar button.main:hover{background:color-mix(in srgb, var(--blue) 88%, #000)}
.app:not([data-state="idle"]) .bar button.main{background:var(--ink);min-width:calc(var(--btn-h) * 2.6)}
.app:not([data-state="idle"]) .bar button.main:hover{background:color-mix(in srgb, var(--ink) 85%, #fff)}
.bar svg{width:clamp(14px,4vmin,20px);height:clamp(14px,4vmin,20px);flex:none}

/* Innstillinger */
.sheet{
  position:absolute;inset:0;z-index:8;
  overflow:auto;
  padding:clamp(12px,4vmin,32px);
  background:var(--paper);color:var(--ink);
}
.sheet-inner{max-width:420px;margin:0 auto;display:grid;gap:16px}
.sheet-head{display:flex;align-items:center;justify-content:space-between;gap:12px}
.sheet h2{font-family:var(--font-display);font-weight:700;font-size:22px;margin:0;letter-spacing:-.01em}
.close{
  width:40px;height:40px;flex:none;display:grid;place-items:center;
  border:1.5px solid var(--line);border-radius:10px;background:var(--paper);color:var(--ink);cursor:pointer;
}
.close:hover{background:var(--wash)}
.close svg{width:18px;height:18px}
.group{display:grid;gap:10px}
.field-label{font-size:14px;font-weight:700;color:var(--soft-ink)}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:4px;padding:4px;background:var(--wash);border-radius:12px}
.seg button{
  border:0;background:transparent;padding:9px 8px;border-radius:9px;
  font:inherit;font-weight:700;font-size:15px;color:var(--soft-ink);cursor:pointer;
}
.seg button[aria-pressed="true"]{background:var(--paper);color:var(--ink);box-shadow:0 1px 3px rgba(15,35,64,.16)}
.dur{display:grid;grid-template-columns:48px 1fr 1fr 48px;gap:8px;align-items:center}
.step{
  height:54px;border-radius:12px;border:1.5px solid var(--line);background:var(--paper);
  font-size:26px;font-weight:700;line-height:1;color:var(--ink);cursor:pointer;
}
.step:hover,.chip:hover{background:var(--wash)}
.num{
  height:54px;display:flex;align-items:center;gap:6px;padding:0 12px;
  border:1.5px solid var(--line);border-radius:12px;cursor:text;
}
.num:focus-within{border-color:var(--blue);box-shadow:0 0 0 3px color-mix(in srgb, var(--blue) 22%, transparent)}
.num input{
  width:100%;min-width:0;border:0;outline:0;background:transparent;
  font-family:var(--font-display);font-weight:700;font-size:28px;color:var(--ink);
  text-align:right;font-variant-numeric:tabular-nums;
  -moz-appearance:textfield;appearance:textfield;
}
.num input::-webkit-inner-spin-button,.num input::-webkit-outer-spin-button{-webkit-appearance:none;margin:0}
.num span{font-size:15px;color:var(--soft-ink)}
.presets{display:flex;flex-wrap:wrap;gap:8px}
.chip{
  border:1.5px solid var(--line);background:var(--paper);border-radius:999px;
  padding:6px 13px;font:inherit;font-weight:700;font-size:15px;color:var(--ink);cursor:pointer;
}
.chip[aria-pressed="true"]{background:var(--blue);border-color:var(--blue);color:#fff}
.text-input{
  width:100%;height:48px;padding:0 14px;
  border:1.5px solid var(--line);border-radius:12px;background:var(--paper);
  font:inherit;font-size:17px;color:var(--ink);
}
.text-input.time{font-family:var(--font-display);font-weight:700;font-size:24px;height:54px}
.text-input:focus{outline:0;border-color:var(--blue);box-shadow:0 0 0 3px color-mix(in srgb, var(--blue) 22%, transparent)}
.row{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.check{display:flex;align-items:center;gap:10px;font-weight:700;cursor:pointer}
.check input{width:20px;height:20px;margin:0;accent-color:var(--blue)}
.ghost{
  border:0;background:transparent;color:var(--blue);
  font:inherit;font-weight:700;cursor:pointer;padding:6px 8px;border-radius:8px;
  text-decoration:underline;text-underline-offset:3px;
}
.primary{
  height:56px;border:0;border-radius:14px;background:var(--blue);color:#fff;
  font-family:var(--font-display);font-weight:700;font-size:20px;cursor:pointer;
  box-shadow:0 6px 18px color-mix(in srgb, var(--blue) 35%, transparent);
}
.primary:hover{filter:brightness(1.08)}
.err{margin:0;color:var(--red);font-size:14px;font-weight:700;line-height:1.4}
.keys{margin:0;font-size:13px;color:var(--soft-ink);line-height:1.9}
kbd{
  font-family:inherit;font-size:12px;font-weight:700;color:var(--ink);
  border:1px solid var(--line);border-bottom-width:2px;border-radius:5px;
  padding:1px 6px;background:var(--wash);
}

.flash{position:absolute;inset:0;background:#fff;opacity:0;pointer-events:none;z-index:4}
@keyframes flash{from{opacity:.85}to{opacity:0}}
.flash.go{animation:flash 1.1s ease-out}

.toast{
  position:absolute;top:var(--edge);left:50%;transform:translateX(-50%);
  max-width:calc(100% - 2 * var(--edge));
  padding:clamp(6px,1.6vmin,10px) clamp(10px,3vmin,16px);border-radius:10px;
  background:var(--ink);color:#fff;
  font-size:clamp(12px,3.2vmin,15px);font-weight:700;text-align:center;
  opacity:0;pointer-events:none;transition:opacity .3s ease;z-index:10;
}
.toast.show{opacity:1}
.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}

/* Smal boks: bare ikoner på knappene ved siden av hovedknappen */
@media (max-width:520px){
  .bar .lbl{display:none}
  .bar button.only-run:not(.main){padding:0;min-width:var(--btn-h)}
}

@media (prefers-reduced-motion:reduce){
  .digits.pulse,.flash.go,.app[data-state="paused"] .digits{animation:none}
  html,body,.arc,.track,.bar,.toast,.dial-wrap{transition:none}
}
</style>
</head>
<body>
<div class="app" id="app" data-state="idle">

  <div class="dial-wrap">
    <div class="dial" id="dial" role="timer" title="Klikk for å endre tiden">
      <svg viewBox="0 0 100 100" aria-hidden="true">
        <circle class="track" cx="50" cy="50" r="45"/>
        <circle class="arc" id="arc" cx="50" cy="50" r="45"/>
      </svg>
      <div class="readout">
        <div class="title" id="titleText">Friminutt</div>
        <div class="pre">Du er</div>
        <div class="digits" id="digits">10:00</div>
        <div class="post">for sen</div>
        <div class="sub" id="sub">Klar til start</div>
      </div>
    </div>
  </div>

  <nav class="bar" id="bar" aria-label="Styr timeren">
    <button type="button" class="only-idle icon" id="idleMinus" aria-label="Ett minutt kortere" title="Ett minutt kortere">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M5 12h14"/></svg>
    </button>
    <button type="button" class="only-idle main" id="idleStart">
      <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M8 5.5v13a1 1 0 0 0 1.5.86l10.5-6.5a1 1 0 0 0 0-1.72L9.5 4.64A1 1 0 0 0 8 5.5z"/></svg>
      <span>Start</span>
    </button>
    <button type="button" class="only-idle icon" id="idlePlus" aria-label="Ett minutt lengre" title="Ett minutt lengre">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
    </button>
    <button type="button" class="only-idle icon" id="openSheet" aria-label="Innstillinger" title="Innstillinger">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M4 7h9M19 7h1M4 17h3M13 17h7"/><circle cx="16" cy="7" r="2.6"/><circle cx="10" cy="17" r="2.6"/></svg>
    </button>

    <button type="button" class="only-run main" id="pauseBtn">
      <svg class="i-pause" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><rect x="6" y="5" width="4" height="14" rx="1"/><rect x="14" y="5" width="4" height="14" rx="1"/></svg>
      <svg class="i-play" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true" hidden><path d="M8 5.5v13a1 1 0 0 0 1.5.86l10.5-6.5a1 1 0 0 0 0-1.72L9.5 4.64A1 1 0 0 0 8 5.5z"/></svg>
      <span>Pause</span>
    </button>
    <button type="button" class="only-run" id="minusBtn" aria-label="Minus 1 min" title="Ett minutt mindre">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M5 12h14"/></svg>
      <span class="lbl">1 min</span>
    </button>
    <button type="button" class="only-run" id="plusBtn" aria-label="Pluss 1 min" title="Ett minutt mer">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
      <span class="lbl">1 min</span>
    </button>
    <button type="button" class="only-run" id="stopBtn" aria-label="Avslutt" title="Avslutt">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>
      <span class="lbl">Avslutt</span>
    </button>
  </nav>

  <form class="sheet" id="sheet" hidden novalidate aria-labelledby="sheetTitle">
    <div class="sheet-inner">
      <div class="sheet-head">
        <h2 id="sheetTitle">Still inn friminuttet</h2>
        <button type="button" class="close" id="closeSheet" aria-label="Lukk innstillingene">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>
        </button>
      </div>

      <div class="seg" role="group" aria-label="Hvordan vil du stille inn tiden?">
        <button type="button" id="modeDur" aria-pressed="true">Lengde</button>
        <button type="button" id="modeUntil" aria-pressed="false">Til klokkeslett</button>
      </div>

      <div class="group" id="durFields">
        <div class="dur">
          <button type="button" class="step" id="stepDown" aria-label="Ett minutt kortere">−</button>
          <label class="num" for="minInput"><input id="minInput" type="number" inputmode="numeric" min="0" max="600" value="10" aria-label="Minutter"><span>min</span></label>
          <label class="num" for="secInput"><input id="secInput" type="number" inputmode="numeric" min="0" max="59" value="00" aria-label="Sekunder"><span>sek</span></label>
          <button type="button" class="step" id="stepUp" aria-label="Ett minutt lengre">+</button>
        </div>
        <div class="presets" role="group" aria-label="Hurtigvalg">
          <button type="button" class="chip" data-min="5">5 min</button>
          <button type="button" class="chip" data-min="10">10 min</button>
          <button type="button" class="chip" data-min="15">15 min</button>
          <button type="button" class="chip" data-min="20">20 min</button>
          <button type="button" class="chip" data-min="30">30 min</button>
        </div>
        <p class="err" id="durErr" hidden></p>
      </div>

      <div class="group" id="untilFields" hidden>
        <label class="field-label" for="untilInput">Timen starter kl.</label>
        <input class="text-input time" id="untilInput" type="time" step="60">
        <p class="err" id="untilErr" hidden></p>
      </div>

      <div class="group">
        <label class="field-label" for="titleInput">Overskrift</label>
        <input class="text-input" id="titleInput" type="text" maxlength="40" value="Friminutt" autocomplete="off">
      </div>

      <div class="row">
        <label class="check" for="soundInput"><input id="soundInput" type="checkbox" checked> Lyd når tiden er ute</label>
        <button type="button" class="ghost" id="testSound">Test lyd</button>
      </div>

      <button type="submit" class="primary" id="startBtn">Start friminutt</button>

      <p class="keys"><kbd>Mellomrom</kbd> start/pause &nbsp;·&nbsp; <kbd>↑</kbd> <kbd>↓</kbd> ett minutt mer/mindre &nbsp;·&nbsp; <kbd>Esc</kbd> lukk</p>
    </div>
  </form>

  <div class="flash" id="flash" aria-hidden="true"></div>
  <div class="toast" id="toast" role="status"></div>
  <div class="sr-only" id="live" aria-live="polite"></div>
</div>

<script>
(function(){
  'use strict';
  var $ = function(id){ return document.getElementById(id); };
  var root = document.documentElement;
  var app = $('app'), bar = $('bar'), sheet = $('sheet');
  var digitsEl = $('digits'), subEl = $('sub'), arc = $('arc'), titleEl = $('titleText');
  var minInput = $('minInput'), secInput = $('secInput'), untilInput = $('untilInput'), titleInput = $('titleInput'), soundInput = $('soundInput');
  var durErr = $('durErr'), untilErr = $('untilErr');
  var pauseBtn = $('pauseBtn');

  var C = 2 * Math.PI * 45;
  try { if (arc.getTotalLength) { var L = arc.getTotalLength(); if (L > 0) C = L; } } catch (e) {}
  arc.style.strokeDasharray = C.toFixed(3);

  function pad(n){ return String(n).padStart(2, '0'); }
  function clockStr(d){ return pad(d.getHours()) + ':' + pad(d.getMinutes()); }
  function fmt(totalSec){
    var h = Math.floor(totalSec / 3600), m = Math.floor((totalSec % 3600) / 60), s = totalSec % 60;
    return h > 0 ? h + ':' + pad(m) + ':' + pad(s) : pad(m) + ':' + pad(s);
  }
  function clampInt(v, lo, hi){ var n = parseInt(v, 10); return isNaN(n) ? lo : Math.max(lo, Math.min(hi, n)); }

  /* ---------- Innstillinger: lagret i nettleseren, overstyrt av adressen (?min=10&sek=0&til=10:15&tittel=Friminutt&lyd=0) ---------- */
  var STORE = 'friminutt-timer-v1';
  var settings = { mode:'duration', min:10, sec:0, until:'', title:'Friminutt', sound:true };
  try {
    var saved = JSON.parse(localStorage.getItem(STORE) || 'null');
    if (saved && typeof saved === 'object') Object.assign(settings, saved);
  } catch (e) {}
  function save(){ try { localStorage.setItem(STORE, JSON.stringify(settings)); } catch (e) {} }

  function untilTarget(str){
    var m = /^(\d{1,2})[:.](\d{2})/.exec(str || '');
    if (!m) return null;
    var d = new Date(); d.setHours(+m[1], +m[2], 0, 0);
    return d.getTime();
  }
  function defaultUntil(){
    var d = new Date(Date.now() + 10 * 60000);
    d.setMinutes(Math.ceil(d.getMinutes() / 5) * 5, 0, 0);
    return clockStr(d);
  }
  if (!settings.until || (untilTarget(settings.until) || 0) <= Date.now()) settings.until = defaultUntil();

  try {
    var q = new URLSearchParams(location.search);
    if (q.has('min') || q.has('sek')) {
      settings.mode = 'duration';
      settings.min = q.has('min') ? clampInt(q.get('min'), 0, 600) : 0;
      settings.sec = q.has('sek') ? clampInt(q.get('sek'), 0, 59) : 0;
    }
    if (q.has('til') && untilTarget(q.get('til')) != null) {
      settings.mode = 'until';
      var tm = /^(\d{1,2})[:.](\d{2})/.exec(q.get('til'));
      settings.until = pad(+tm[1]) + ':' + tm[2];
    }
    if (q.has('tittel')) settings.title = q.get('tittel').slice(0, 40);
    if (q.has('lyd')) settings.sound = q.get('lyd') !== '0';
  } catch (e) {}

  function plannedMs(){
    if (settings.mode === 'until') {
      var t = untilTarget(settings.until);
      if (t == null) return { err:'Skriv inn et klokkeslett, for eksempel 10:15.' };
      var ms = t - Date.now();
      if (ms <= 0) return { err:'Klokkeslettet har allerede passert. Velg et senere tidspunkt.', passed:true };
      return { ms: ms };
    }
    var d = (settings.min * 60 + settings.sec) * 1000;
    if (d <= 0) return { err:'Velg en lengde som er lengre enn 0 sekunder.' };
    return { ms: d };
  }

  /* ---------- Tilstand ---------- */
  var state = 'idle';           // idle | running | paused
  var endAt = 0, total = 1, pausedRem = 0;
  var chimed = false, lastSec = null, phase = 'calm', shown = '', shownSub = '';

  function remaining(){ return state === 'paused' ? pausedRem : endAt - Date.now(); }

  function setState(s){
    state = s;
    app.dataset.state = s;
    var paused = s === 'paused';
    pauseBtn.querySelector('span').textContent = paused ? 'Fortsett' : 'Pause';
    pauseBtn.querySelector('.i-pause').hidden = paused;
    pauseBtn.querySelector('.i-play').hidden = !paused;
    $('dial').title = s === 'idle' ? 'Klikk for å endre tiden' : '';
    pokeUI();
  }
  function setPhase(p){
    if (p === phase) return;
    var prev = phase; phase = p; root.dataset.phase = p;
    if (state !== 'idle') {
      if (p === 'warn' && prev === 'calm') announce('Ett minutt igjen.');
      if (p === 'over') announce('Friminuttet er over.');
    }
  }
  function announce(msg){ $('live').textContent = msg; }

  function showDigits(str){
    if (str === shown) return;
    shown = str;
    var html = '';
    for (var i = 0; i < str.length; i++) {
      var ch = str[i];
      html += ch === ':' ? '<span class="c">:</span>' : '<span class="d">' + ch + '</span>';
    }
    digitsEl.innerHTML = html;
    digitsEl.classList.toggle('long', str.length > 5);
  }
  function setSub(t){ if (t !== shownSub) { shownSub = t; subEl.textContent = t; } }

  // Nedtelling: buen forsvinner med klokka fra toppen
  function arcRemaining(frac){
    frac = Math.min(1, Math.max(0, frac));
    arc.style.strokeDashoffset = (-C * (1 - frac)).toFixed(3);
    arc.style.visibility = frac < 0.004 ? 'hidden' : 'visible';
  }
  // For sent: buen fylles opp én gang i minuttet
  function arcFill(frac){
    frac = Math.min(1, Math.max(0, frac));
    arc.style.strokeDashoffset = (C * (1 - frac)).toFixed(3);
    arc.style.visibility = frac < 0.004 ? 'hidden' : 'visible';
  }

  function pulse(){ digitsEl.classList.remove('pulse'); void digitsEl.offsetWidth; digitsEl.classList.add('pulse'); }
  function flash(){ var f = $('flash'); f.classList.remove('go'); void f.offsetWidth; f.classList.add('go'); }

  function frame(){
    var now = Date.now();

    if (state === 'idle') {
      setPhase('calm');
      var p = plannedMs();
      if (settings.mode === 'until') { untilErr.textContent = p.err || ''; untilErr.hidden = !p.err; }
      showDigits(fmt(p.ms ? Math.ceil(p.ms / 1000) : 0));
      if (settings.mode === 'until') setSub(p.passed ? 'Klokkeslettet har passert' : 'Til kl. ' + settings.until);
      else setSub('Klar til start');
      arcRemaining(1);
      return;
    }

    var rem = remaining();
    if (rem > 0) {
      var s = Math.ceil(rem / 1000);
      setPhase(s <= 60 ? 'warn' : 'calm');
      showDigits(fmt(s));
      setSub(state === 'paused' ? 'På pause' : 'Timen starter kl. ' + clockStr(new Date(now + rem)));
      arcRemaining(rem / total);
      if (state === 'running' && s <= 10 && lastSec !== null && s !== lastSec) pulse();
      lastSec = s;
      chimed = false;
    } else {
      var late = Math.max(1, Math.ceil(-rem / 1000));
      setPhase('over');
      showDigits(fmt(late));
      setSub((state === 'paused' ? 'På pause · ' : '') + 'Timen startet kl. ' + clockStr(new Date(now + rem)));
      arcFill(((-rem) % 60000) / 60000);
      if (!chimed) {
        chimed = true;
        if (state === 'running') { flash(); if (settings.sound) chime(); }
      }
      lastSec = null;
    }
  }

  /* ---------- Handlinger ---------- */
  function start(){
    var p = plannedMs();
    if (p.err) {
      var el = settings.mode === 'until' ? untilErr : durErr;
      el.textContent = p.err; el.hidden = false;
      openSheet();
      return false;
    }
    durErr.hidden = true;
    ensureAudio();
    total = p.ms; endAt = Date.now() + p.ms;
    chimed = false; lastSec = null;
    closeSheet(true);
    setState('running');
    requestWake();
    save();
    frame();
    return true;
  }
  function togglePause(){
    if (state === 'running') { pausedRem = endAt - Date.now(); setState('paused'); }
    else if (state === 'paused') { endAt = Date.now() + pausedRem; setState('running'); }
    frame();
  }
  function adjust(deltaMin){
    if (state === 'idle') {
      if (settings.mode === 'duration') {
        settings.min = Math.max(0, Math.min(600, settings.min + deltaMin));
        durErr.hidden = true;
      } else {
        var t = untilTarget(settings.until);
        if (t != null) settings.until = clockStr(new Date(t + deltaMin * 60000));
      }
      syncInputs(); save(); frame();
      return;
    }
    var d = deltaMin * 60000;
    if (state === 'running') endAt += d; else pausedRem += d;
    total = Math.max(1000, total + d);
    frame();
    toast(deltaMin > 0 ? 'Ett minutt lagt til' : 'Ett minutt trukket fra');
  }
  function stop(){
    setState('idle');
    releaseWake();
    lastSec = null; chimed = false;
    frame();
  }

  /* ---------- Innstillingsark ---------- */
  function openSheet(){
    if (state !== 'idle') return;
    syncInputs();
    sheet.hidden = false;
    var f = settings.mode === 'duration' ? minInput : untilInput;
    setTimeout(function(){ try { f.focus({ preventScroll:true }); if (f.select) f.select(); } catch (e) {} }, 0);
  }
  function closeSheet(silent){
    if (sheet.hidden) return;
    sheet.hidden = true;
    if (!silent) $('openSheet').focus({ preventScroll:true });
  }

  /* ---------- Lyd: tre klokketoner ---------- */
  var actx = null;
  function ensureAudio(){
    try {
      if (!actx) { var AC = window.AudioContext || window.webkitAudioContext; if (AC) actx = new AC(); }
      if (actx && actx.state === 'suspended') actx.resume();
    } catch (e) { actx = null; }
  }
  function bell(freq, t){
    var g = actx.createGain();
    g.connect(actx.destination);
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(0.32, t + 0.015);
    g.gain.exponentialRampToValueAtTime(0.0001, t + 1.7);
    [[1, 1], [2.01, .32], [3.02, .12]].forEach(function(pt){
      var o = actx.createOscillator(), og = actx.createGain();
      o.type = 'sine'; o.frequency.value = freq * pt[0]; og.gain.value = pt[1];
      o.connect(og); og.connect(g);
      o.start(t); o.stop(t + 1.8);
    });
  }
  function chime(){
    if (!actx) return;
    try {
      var t0 = actx.currentTime + 0.05;
      [783.99, 659.25, 523.25].forEach(function(f, i){ bell(f, t0 + i * 0.45); });
    } catch (e) {}
  }

  /* ---------- Hold skjermen våken der nettleseren tillater det ---------- */
  var wake = null;
  function requestWake(){
    try {
      if ('wakeLock' in navigator && document.visibilityState === 'visible') {
        navigator.wakeLock.request('screen').then(function(w){ wake = w; }).catch(function(){ wake = null; });
      }
    } catch (e) { wake = null; }
  }
  function releaseWake(){ try { if (wake) wake.release(); } catch (e) {} wake = null; }
  document.addEventListener('visibilitychange', function(){
    if (document.visibilityState === 'visible' && state !== 'idle') requestWake();
    frame();
  });

  /* ---------- Melding ---------- */
  var toastT = null;
  function toast(msg){
    var el = $('toast');
    el.textContent = msg; el.classList.add('show');
    clearTimeout(toastT);
    toastT = setTimeout(function(){ el.classList.remove('show'); }, 2400);
  }

  /* ---------- Skjul kontrollene når musa er i ro eller utenfor widgeten ---------- */
  var hideT = null, overBar = false;
  function pokeUI(){
    app.classList.remove('hide-ui');
    clearTimeout(hideT);
    if (state === 'running') {
      hideT = setTimeout(function(){ if (state === 'running' && !overBar) app.classList.add('hide-ui'); }, 2500);
    }
  }
  ['pointermove', 'pointerdown', 'keydown', 'touchstart'].forEach(function(ev){
    window.addEventListener(ev, pokeUI, { passive:true });
  });
  document.documentElement.addEventListener('mouseleave', function(){
    overBar = false;
    clearTimeout(hideT);
    if (state === 'running') hideT = setTimeout(function(){ if (state === 'running') app.classList.add('hide-ui'); }, 600);
  });
  bar.addEventListener('pointerenter', function(){ overBar = true; });
  bar.addEventListener('pointerleave', function(){ overBar = false; pokeUI(); });

  /* ---------- Tastatur ---------- */
  window.addEventListener('keydown', function(e){
    if (e.ctrlKey || e.metaKey || e.altKey) return;
    if (!sheet.hidden) { if (e.key === 'Escape') { e.preventDefault(); closeSheet(); } return; }
    var t = e.target, tag = t && t.tagName;
    if ((tag === 'INPUT' && t.type !== 'checkbox') || tag === 'TEXTAREA') return;
    if (e.code === 'Space' || e.key === ' ') {
      if (tag === 'BUTTON' || tag === 'INPUT') return;
      e.preventDefault();
      if (state === 'idle') start(); else togglePause();
    } else if (e.key === 'ArrowUp' || e.key === '+') {
      e.preventDefault(); adjust(1);
    } else if (e.key === 'ArrowDown' || e.key === '-') {
      e.preventDefault(); adjust(-1);
    }
  });

  /* ---------- Skjema ---------- */
  function syncInputs(){
    var a = document.activeElement;
    if (a !== minInput) minInput.value = settings.min;
    if (a !== secInput) secInput.value = pad(settings.sec);
    if (a !== untilInput) untilInput.value = settings.until;
    if (a !== titleInput) titleInput.value = settings.title;
    var title = (settings.title || '').trim();
    titleEl.textContent = title; titleEl.hidden = !title;
    soundInput.checked = !!settings.sound;
    $('modeDur').setAttribute('aria-pressed', String(settings.mode === 'duration'));
    $('modeUntil').setAttribute('aria-pressed', String(settings.mode === 'until'));
    $('durFields').hidden = settings.mode !== 'duration';
    $('untilFields').hidden = settings.mode !== 'until';
    document.querySelectorAll('.chip').forEach(function(c){
      c.setAttribute('aria-pressed', String(settings.mode === 'duration' && +c.dataset.min === settings.min && settings.sec === 0));
    });
  }

  minInput.addEventListener('input', function(){ settings.min = clampInt(minInput.value, 0, 600); durErr.hidden = true; syncInputs(); save(); frame(); });
  secInput.addEventListener('input', function(){ settings.sec = clampInt(secInput.value, 0, 59); durErr.hidden = true; syncInputs(); save(); frame(); });
  minInput.addEventListener('blur', function(){ minInput.value = settings.min; });
  secInput.addEventListener('blur', function(){ secInput.value = pad(settings.sec); });
  $('stepDown').addEventListener('click', function(){ adjust(-1); });
  $('stepUp').addEventListener('click', function(){ adjust(1); });
  document.querySelectorAll('.chip').forEach(function(c){
    c.addEventListener('click', function(){ settings.mode = 'duration'; settings.min = +c.dataset.min; settings.sec = 0; durErr.hidden = true; syncInputs(); save(); frame(); });
  });
  $('modeDur').addEventListener('click', function(){ settings.mode = 'duration'; syncInputs(); save(); frame(); });
  $('modeUntil').addEventListener('click', function(){
    settings.mode = 'until';
    if ((untilTarget(settings.until) || 0) <= Date.now()) settings.until = defaultUntil();
    syncInputs(); save(); frame();
  });
  untilInput.addEventListener('input', function(){ settings.until = untilInput.value; save(); frame(); });
  titleInput.addEventListener('input', function(){ settings.title = titleInput.value; syncInputs(); save(); });
  soundInput.addEventListener('change', function(){ settings.sound = soundInput.checked; save(); });
  $('testSound').addEventListener('click', function(){ ensureAudio(); chime(); });
  sheet.addEventListener('submit', function(e){ e.preventDefault(); start(); });
  $('closeSheet').addEventListener('click', function(){ closeSheet(); });
  $('dial').addEventListener('click', function(){ if (state === 'idle') openSheet(); });

  // Knappene i kontrollinjen: slipp fokus etter museklikk, så mellomrom alltid betyr start/pause
  function barClick(fn){ return function(e){ fn(); if (e.detail > 0 && e.currentTarget && e.currentTarget.blur) e.currentTarget.blur(); }; }
  $('idleMinus').addEventListener('click', barClick(function(){ adjust(-1); }));
  $('idlePlus').addEventListener('click', barClick(function(){ adjust(1); }));
  $('idleStart').addEventListener('click', barClick(start));
  $('openSheet').addEventListener('click', openSheet);
  pauseBtn.addEventListener('click', barClick(togglePause));
  $('minusBtn').addEventListener('click', barClick(function(){ adjust(-1); }));
  $('plusBtn').addEventListener('click', barClick(function(){ adjust(1); }));
  $('stopBtn').addEventListener('click', barClick(stop));

  /* ---------- Start ---------- */
  syncInputs();
  frame();
  (function loop(){ frame(); requestAnimationFrame(loop); })();
  setInterval(frame, 500); // holder tiden og lyden i gang selv om fanen er i bakgrunnen
})();
</script>
</body>
</html>
