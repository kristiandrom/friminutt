<!DOCTYPE html>
<html lang="nb">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dagens tips</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Bricolage+Grotesque:opsz,wght@12..96,500..800&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
:root{
  /* Layout: widget som fyller boksen den ligger i (iframe i Classroomscreen). Overskrift og dato øverst, tipset midt i (kategori, taster eller kode, forklaring), kontrollinje nederst som skjules. Alt skalerer med boksens korteste side. */
  --sky:#E4EEF8;
  --ink:#0F2340;
  --blue:#2A5BD7;
  --paper:#FFFFFF;
  --term:#0F2340;
  --font-display:"Bricolage Grotesque","Segoe UI",system-ui,-apple-system,sans-serif;
  --font-body:"Atkinson Hyperlegible","Segoe UI",system-ui,-apple-system,sans-serif;
  --font-mono:"JetBrains Mono",ui-monospace,"Cascadia Code",Consolas,monospace;

  --line:color-mix(in srgb, var(--ink) 16%, var(--paper));
  --wash:color-mix(in srgb, var(--ink) 6%, var(--paper));
  --soft-ink:color-mix(in srgb, var(--ink) 70%, var(--paper));
  --cat:var(--blue);

  --edge:clamp(10px, 4vmin, 40px);
  --btn-h:clamp(30px, 9vmin, 50px);
  color-scheme:light;
}
*{box-sizing:border-box}
[hidden]{display:none !important}
html,body{height:100%;margin:0}
body{background:var(--sky);color:var(--ink);font-family:var(--font-body);overflow:hidden}
:focus-visible{outline:3px solid var(--blue);outline-offset:2px}

.app{position:relative;height:100%;display:grid;grid-template-rows:auto 1fr}

header{
  display:flex;align-items:baseline;justify-content:space-between;gap:12px;
  padding:var(--edge) var(--edge) 0;
}
h1{
  margin:0;min-width:0;
  font-family:var(--font-display);font-weight:800;
  font-size:clamp(16px,5.4vmin,46px);letter-spacing:-.01em;line-height:1.05;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
.when{
  flex:none;
  font-size:clamp(12px,3.3vmin,24px);font-weight:700;color:var(--soft-ink);
}
.back{
  flex:none;border:0;background:transparent;cursor:pointer;
  font:inherit;font-size:clamp(12px,3.3vmin,22px);font-weight:700;color:var(--blue);
  text-decoration:underline;text-underline-offset:3px;padding:2px 4px;border-radius:6px;
}

main{
  min-height:0;overflow:auto;
  display:grid;place-items:center;
  padding:clamp(6px,2vmin,20px) var(--edge) calc(var(--edge) + var(--btn-h) * .4);
}
.card{
  width:min(100%, 1100px);
  display:flex;flex-direction:column;align-items:center;text-align:center;
  gap:clamp(8px,3vmin,30px);
}
@keyframes enter{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.card.enter{animation:enter .45s ease-out}

.chip{
  display:inline-flex;align-items:center;gap:.5em;
  padding:.35em .9em;border-radius:999px;
  background:color-mix(in srgb, var(--cat) 12%, var(--paper));
  color:color-mix(in srgb, var(--cat) 80%, #000);
  font-weight:700;font-size:clamp(12px,3.2vmin,24px);
}
.chip::before{content:"";width:.6em;height:.6em;border-radius:50%;background:var(--cat)}

.rows{display:flex;flex-direction:column;align-items:center;gap:clamp(6px,2vmin,18px);max-width:100%}
.keyrow{
  display:flex;flex-wrap:wrap;align-items:center;justify-content:center;
  gap:.3em;
  font-family:var(--font-display);font-weight:700;
  font-size:clamp(18px,8vmin,68px);
}
.keyrow.small{font-size:clamp(14px,4.6vmin,38px)}
.keyrow.small .lbl{font-size:.6em}
.lbl{
  font-family:var(--font-body);font-weight:700;
  font-size:.42em;color:var(--soft-ink);
  margin-right:.4em;letter-spacing:.02em;text-transform:uppercase;
}
.key{
  display:inline-block;min-width:1.5em;
  padding:.12em .45em .16em;
  background:var(--paper);color:var(--ink);
  border:2px solid var(--line);border-bottom-width:.14em;border-radius:.22em;
  line-height:1.15;text-align:center;
  box-shadow:0 2px 6px rgba(15,35,64,.08);
}
.key.mouse{border-style:dashed;border-bottom-width:2px;background:color-mix(in srgb, var(--paper) 70%, transparent)}
.plus,.or{color:var(--soft-ink);font-weight:600;font-size:.7em}
.then{font-family:var(--font-body);color:var(--soft-ink);font-weight:700;font-size:.42em;margin:0 .3em}

.coderow{display:flex;flex-direction:column;align-items:center;gap:.4em;max-width:100%}
.code{
  margin:0;max-width:100%;
  padding:.55em .9em;border-radius:.4em;
  background:var(--term);color:#F4F7FB;
  font-family:var(--font-mono);font-weight:500;
  font-size:clamp(15px,6vmin,52px);line-height:1.35;text-align:left;
  white-space:pre-wrap;overflow-wrap:anywhere;
  box-shadow:0 6px 18px rgba(15,35,64,.18);
}
.code.long{font-size:clamp(13px,4.4vmin,38px)}
.code.xlong{font-size:clamp(12px,3.4vmin,30px)}
.code .prompt{color:#7FA7FF;user-select:none}
.code.small{font-size:clamp(12px,3.6vmin,30px);opacity:.9}
.coderow .lbl{font-size:clamp(11px,2.6vmin,18px);margin:0}

.desc{
  margin:0;max-width:30ch;
  font-family:var(--font-display);font-weight:700;
  font-size:clamp(16px,5.6vmin,48px);line-height:1.15;letter-spacing:-.01em;
  text-wrap:balance;
}
.tip{
  margin:0;max-width:52ch;
  font-size:clamp(12px,3.4vmin,26px);line-height:1.45;color:var(--soft-ink);
  text-wrap:balance;
}
.empty{font-size:clamp(14px,4vmin,28px);font-weight:700;color:var(--soft-ink);max-width:28ch}

/* Kontrollinje */
.bar{
  position:absolute;left:50%;bottom:clamp(8px,2.4vmin,22px);
  transform:translateX(-50%);
  display:flex;gap:clamp(2px,.8vmin,6px);
  padding:clamp(4px,1.1vmin,8px);
  background:var(--paper);color:var(--ink);
  border-radius:clamp(10px,3vmin,18px);
  box-shadow:0 1px 2px rgba(0,0,0,.08),0 8px 24px rgba(0,0,0,.16);
  transition:opacity .35s ease,transform .35s ease;
  z-index:5;
}
.app.hide-ui .bar{opacity:0;transform:translate(-50%,10px);pointer-events:none}
.bar button{
  display:flex;align-items:center;justify-content:center;gap:clamp(4px,1.2vmin,8px);
  height:var(--btn-h);min-width:var(--btn-h);padding:0 clamp(8px,2.4vmin,14px);
  border:0;border-radius:clamp(7px,2vmin,12px);background:transparent;color:var(--ink);
  font:inherit;font-weight:700;font-size:clamp(12px,3.3vmin,16px);white-space:nowrap;cursor:pointer;
}
.bar button.icon{padding:0}
.bar button:hover{background:var(--wash)}
.bar svg{width:clamp(14px,4vmin,20px);height:clamp(14px,4vmin,20px);flex:none}

/* Innstillinger */
.sheet{
  position:absolute;inset:0;z-index:8;overflow:auto;
  padding:clamp(12px,4vmin,32px);
  background:var(--paper);color:var(--ink);
}
.sheet-inner{max-width:460px;margin:0 auto;display:grid;gap:18px}
.sheet-head{display:flex;align-items:center;justify-content:space-between;gap:12px}
.sheet h2{font-family:var(--font-display);font-weight:700;font-size:22px;margin:0}
.close{
  width:40px;height:40px;flex:none;display:grid;place-items:center;
  border:1.5px solid var(--line);border-radius:10px;background:var(--paper);color:var(--ink);cursor:pointer;
}
.close svg{width:18px;height:18px}
.group{display:grid;gap:10px}
.field-label{font-size:14px;font-weight:700;color:var(--soft-ink)}
.text-input,.select{
  width:100%;height:48px;padding:0 14px;
  border:1.5px solid var(--line);border-radius:12px;background:var(--paper);
  font:inherit;font-size:17px;color:var(--ink);
}
.text-input:focus,.select:focus{outline:0;border-color:var(--blue);box-shadow:0 0 0 3px color-mix(in srgb, var(--blue) 22%, transparent)}
.seg{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;padding:4px;background:var(--wash);border-radius:12px}
.seg button{
  border:0;background:transparent;padding:9px 6px;border-radius:9px;
  font:inherit;font-weight:700;font-size:15px;color:var(--soft-ink);cursor:pointer;
}
.seg button[aria-pressed="true"]{background:var(--paper);color:var(--ink);box-shadow:0 1px 3px rgba(15,35,64,.16)}
.cats{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:6px 12px}
.check{display:flex;align-items:center;gap:10px;font-weight:700;cursor:pointer;padding:5px 0}
.check input{width:20px;height:20px;margin:0;accent-color:var(--blue);flex:none}
.check .n{font-weight:400;color:var(--soft-ink);font-size:14px}
.links{display:flex;gap:6px}
.ghost{
  border:0;background:transparent;color:var(--blue);
  font:inherit;font-weight:700;font-size:14px;cursor:pointer;padding:4px 6px;border-radius:8px;
  text-decoration:underline;text-underline-offset:3px;
}
.row{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.primary{
  height:54px;border:0;border-radius:14px;background:var(--blue);color:#fff;
  font-family:var(--font-display);font-weight:700;font-size:19px;cursor:pointer;
}
.primary:hover{filter:brightness(1.08)}
.err{margin:0;color:#C4213B;font-size:14px;font-weight:700}
.keys-help{margin:0;font-size:13px;color:var(--soft-ink);line-height:1.9}
kbd{
  font-family:inherit;font-size:12px;font-weight:700;color:var(--ink);
  border:1px solid var(--line);border-bottom-width:2px;border-radius:5px;padding:1px 6px;background:var(--wash);
}

@media (prefers-reduced-motion:reduce){
  .card.enter{animation:none}
  .bar{transition:none}
}
</style>
</head>
<body>
<div class="app" id="app">
  <header>
    <h1 id="titleText">Dagens tips</h1>
    <span class="when" id="when"></span>
    <button type="button" class="back" id="backBtn" hidden>Tilbake til dagens</button>
  </header>

  <main>
    <div class="card" id="card" aria-live="polite"></div>
  </main>

  <nav class="bar" id="bar" aria-label="Bla i tipsene">
    <button type="button" class="icon" id="prevBtn" aria-label="Forrige tips" title="Forrige (←)">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg>
    </button>
    <button type="button" id="randBtn" title="Tilfeldig (R)">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M16 4h4v4M4 20l16-16M20 16v4h-4M15 15l5 5M4 4l5 5"/></svg>
      <span>Tilfeldig</span>
    </button>
    <button type="button" class="icon" id="nextBtn" aria-label="Neste tips" title="Neste (→)">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 5l7 7-7 7"/></svg>
    </button>
    <button type="button" class="icon" id="openSheet" aria-label="Innstillinger" title="Innstillinger">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M4 7h9M19 7h1M4 17h3M13 17h7"/><circle cx="16" cy="7" r="2.6"/><circle cx="10" cy="17" r="2.6"/></svg>
    </button>
  </nav>

  <form class="sheet" id="sheet" hidden novalidate aria-labelledby="sheetTitle">
    <div class="sheet-inner">
      <div class="sheet-head">
        <h2 id="sheetTitle">Innstillinger</h2>
        <button type="button" class="close" id="closeSheet" aria-label="Lukk innstillingene">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>
        </button>
      </div>

      <div class="group">
        <label class="field-label" for="titleInput">Overskrift</label>
        <input class="text-input" id="titleInput" type="text" maxlength="40" autocomplete="off">
      </div>

      <div class="group">
        <span class="field-label" id="osLabel">Vis snarveier for</span>
        <div class="seg" role="group" aria-labelledby="osLabel">
          <button type="button" data-os="begge" aria-pressed="true">Begge</button>
          <button type="button" data-os="win" aria-pressed="false">Windows</button>
          <button type="button" data-os="mac" aria-pressed="false">Mac</button>
        </div>
      </div>

      <div class="group">
        <label class="field-label" for="byttSelect">Nytt tips</label>
        <select class="select" id="byttSelect">
          <option value="0">Ett nytt hver dag</option>
          <option value="5">Hvert 5. minutt</option>
          <option value="10">Hvert 10. minutt</option>
          <option value="15">Hvert 15. minutt</option>
          <option value="30">Hvert 30. minutt</option>
        </select>
      </div>

      <div class="group">
        <div class="row">
          <span class="field-label" id="catLabel">Kategorier</span>
          <div class="links"><button type="button" class="ghost" id="allCats">Velg alle</button><button type="button" class="ghost" id="noCats">Fjern alle</button></div>
        </div>
        <div class="cats" id="cats" role="group" aria-labelledby="catLabel"></div>
        <p class="err" id="catErr" hidden>Velg minst én kategori.</p>
      </div>

      <button type="submit" class="primary">Ferdig</button>
      <p class="keys-help"><kbd>←</kbd> <kbd>→</kbd> forrige/neste &nbsp;·&nbsp; <kbd>R</kbd> tilfeldig &nbsp;·&nbsp; <kbd>Esc</kbd> lukk</p>
    </div>
  </form>
</div>

<script>

  'use strict';

     TIPSENE
     k = taster på Windows, m = taster på Mac (mangler m: bare Windows)
         + mellom taster som trykkes samtidig, mellomrom mellom trinn,
         / mellom alternativer, _ blir mellomrom inni én tast.
     x = kommando eller kode, xm = egen Mac-variant, os:'win' = bare Windows,
     np = ikke vis $ foran, d = hva den gjør, t = ekstra tips

  /* ========================================================= */

  var $ = function(id){ return document.getElementById(id); };
  var app = $('app'), card = $('card'), bar = $('bar'), sheet = $('sheet');
  var catMap = {};
  CATS.forEach(function(c){ catMap[c[0]] = { id:c[0], name:c[1], color:c[2] }; });

  /* ---------- Innstillinger ---------- */
  var STORE = 'dagens-tips-v1';
  var settings = { title:'Dagens tips', os:'begge', bytt:0, cats: CATS.map(function(c){ return c[0]; }) };
  try {
    var saved = JSON.parse(localStorage.getItem(STORE) || 'null');
    if (saved && typeof saved === 'object') Object.assign(settings, saved);
  } catch (e) {}
  try {
    var q = new URLSearchParams(location.search);
    if (q.has('kat')) {
      var want = q.get('kat').toLowerCase().split(',').map(function(s){ return s.trim(); }).filter(function(s){ return catMap[s]; });
      if (want.length) settings.cats = want;
    }
    if (q.has('os') && /^(win|mac|begge)$/.test(q.get('os'))) settings.os = q.get('os');
    if (q.has('bytt')) { var b = parseInt(q.get('bytt'), 10); settings.bytt = isNaN(b) ? 0 : Math.max(0, Math.min(240, b)); }
    if (q.has('tittel')) settings.title = q.get('tittel').slice(0, 40);
  } catch (e) {}
  function save(){ try { localStorage.setItem(STORE, JSON.stringify(settings)); } catch (e) {} }

  /* ---------- Rekkefølge: fast stokket liste, så kategoriene veksler fra dag til dag ---------- */
  function mulberry32(a){ return function(){ a |= 0; a = a + 0x6D2B79F5 | 0; var t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
  var ORDER = TIPS.map(function(_, i){ return i; });
  (function(){ var r = mulberry32(1106); for (var i = ORDER.length - 1; i > 0; i--) { var j = Math.floor(r() * (i + 1)); var t = ORDER[i]; ORDER[i] = ORDER[j]; ORDER[j] = t; } })();

  function availableFor(tip, os){
    if (tip.k) return os === 'win' ? true : os === 'mac' ? !!tip.m : true;
    if (os === 'mac' && tip.os === 'win') return false;
    return true;
  }
  function pool(){
    return ORDER.filter(function(i){ var t = TIPS[i]; return settings.cats.indexOf(t.c) >= 0 && availableFor(t, settings.os); });
  }

  var offset = 0;   // hvor mange steg brukeren har bladd fra «dagens»
  var shownKey = '';

  function slotIndex(){
    var now = new Date();
    if (settings.bytt > 0) return Math.floor(now.getTime() / (settings.bytt * 60000));
    return Math.floor(Date.UTC(now.getFullYear(), now.getMonth(), now.getDate()) / 864e5);
  }

  /* ---------- Tegning ---------- */
  var KEYNAMES = { Up:'↑', Down:'↓', Left:'←', Right:'→', Space:'Mellomrom', Win:'⊞ Win', Cmd:'⌘ Cmd', Option:'⌥ Option', Plus:'+' };
  var MOUSE = /klikk|dra/i;

  function el(tag, cls, text){ var e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; }

  function keyRow(spec, label, small){
    var row = el('div', 'keyrow' + (small ? ' small' : ''));
    if (label) row.appendChild(el('span', 'lbl', label));
    spec.split(' ').forEach(function(chord, ci){
      if (ci > 0) row.appendChild(el('span', 'then', 'så'));
      chord.split('+').forEach(function(tok, ki){
        if (ki > 0) row.appendChild(el('span', 'plus', '+'));
        var alts = (tok.length > 1 && tok.indexOf('/') > 0) ? tok.split('/') : [tok];
        alts.forEach(function(a, ai){
          if (ai > 0) row.appendChild(el('span', 'or', '/'));
          var name = KEYNAMES[a] || a.replace(/_/g, ' ');
          row.appendChild(el('span', 'key' + (MOUSE.test(a) ? ' mouse' : ''), name));
        });
      });
    });
    return row;
  }
  function codeBlock(text, withPrompt, small){
    var pre = el('pre', 'code');
    var longest = Math.max.apply(null, text.split('\n').map(function(l){ return l.length; }));
    if (longest > 52) pre.classList.add('xlong'); else if (longest > 32) pre.classList.add('long');
    if (small) pre.classList.add('small');
    if (withPrompt) pre.appendChild(el('span', 'prompt', '$ '));
    pre.appendChild(document.createTextNode(text));
    return pre;
  }

  function render(force){
    var list = pool();
    var whenEl = $('when'), back = $('backBtn');
    back.hidden = offset === 0;
    whenEl.hidden = offset !== 0;
    if (settings.bytt > 0) whenEl.textContent = 'Nytt tips hvert ' + settings.bytt + '. minutt';
    else { try { whenEl.textContent = new Date().toLocaleDateString('nb-NO', { weekday:'long', day:'numeric', month:'long' }); } catch (e) { whenEl.textContent = ''; } }

    if (!list.length) {
      if (shownKey === 'empty' && !force) return;
      shownKey = 'empty';
      card.innerHTML = '';
      card.appendChild(el('p', 'empty', 'Ingen tips passer innstillingene. Åpne innstillingene og velg flere kategorier.'));
      return;
    }
    var n = list.length;
    var idx = list[(((slotIndex() + offset) % n) + n) % n];
    var key = idx + '|' + settings.os;
    if (key === shownKey && !force) return;
    shownKey = key;

    var tip = TIPS[idx], cat = catMap[tip.c];
    card.style.setProperty('--cat', cat.color);
    card.innerHTML = '';
    card.appendChild(el('span', 'chip', cat.name));

    var rows = el('div', 'rows');
    var os = settings.os;
    if (tip.k) {
      if (os === 'win') rows.appendChild(keyRow(tip.k));
      else if (os === 'mac') rows.appendChild(keyRow(tip.m));
      else if (!tip.m) rows.appendChild(keyRow(tip.k, 'Bare Windows'));
      else if (tip.m === tip.k) rows.appendChild(keyRow(tip.k));
      else { rows.appendChild(keyRow(tip.k, 'Windows')); rows.appendChild(keyRow(tip.m, 'Mac', true)); }
    } else {
      var prompt = !!PROMPT[tip.c] && !tip.np;
      var box = el('div', 'coderow');
      if (tip.os === 'win') { box.appendChild(el('span', 'lbl', 'Bare Windows')); box.appendChild(codeBlock(tip.x, prompt)); }
      else if (!tip.xm) box.appendChild(codeBlock(tip.x, prompt));
      else if (os === 'win') box.appendChild(codeBlock(tip.x, prompt));
      else if (os === 'mac') box.appendChild(codeBlock(tip.xm, prompt));
      else {
        box.appendChild(el('span', 'lbl', 'Windows'));
        box.appendChild(codeBlock(tip.x, prompt));
        box.appendChild(el('span', 'lbl', 'Mac'));
        box.appendChild(codeBlock(tip.xm, prompt, true));
      }
      rows.appendChild(box);
    }
    card.appendChild(rows);
    card.appendChild(el('p', 'desc', tip.d));
    if (tip.t) card.appendChild(el('p', 'tip', tip.t));

    card.classList.remove('enter'); void card.offsetWidth; card.classList.add('enter');
  }

  /* ---------- Bla ---------- */
  function step(d){ offset += d; render(); }
  function random(){
    var n = pool().length; if (n < 2) return;
    var r; do { r = Math.floor(Math.random() * n); } while (r === (((offset % n) + n) % n));
    offset = r; render();
  }
  function backToToday(){ offset = 0; render(); }

  /* ---------- Innstillingsark ---------- */
  var catsBox = $('cats');
  CATS.forEach(function(c){
    var count = TIPS.filter(function(t){ return t.c === c[0]; }).length;
    var lab = el('label', 'check'); lab.htmlFor = 'cat-' + c[0];
    var cb = el('input'); cb.type = 'checkbox'; cb.id = 'cat-' + c[0]; cb.value = c[0];
    lab.appendChild(cb);
    var name = el('span', null, c[1] + ' ');
    name.appendChild(el('span', 'n', '(' + count + ')'));
    lab.appendChild(name);
    catsBox.appendChild(lab);
    cb.addEventListener('change', readCats);
  });
  function readCats(){
    settings.cats = Array.prototype.map.call(catsBox.querySelectorAll('input:checked'), function(i){ return i.value; });
    $('catErr').hidden = settings.cats.length > 0;
    save(); render(true);
  }
  function syncSheet(){
    $('titleInput').value = settings.title;
    document.querySelectorAll('[data-os]').forEach(function(b){ b.setAttribute('aria-pressed', String(b.dataset.os === settings.os)); });
    var sel = $('byttSelect');
    if (!sel.querySelector('option[value="' + settings.bytt + '"]')) { var o = el('option', null, 'Hvert ' + settings.bytt + '. minutt'); o.value = settings.bytt; sel.appendChild(o); }
    sel.value = String(settings.bytt);
    catsBox.querySelectorAll('input').forEach(function(i){ i.checked = settings.cats.indexOf(i.value) >= 0; });
  }
  function syncTitle(){ var t = (settings.title || '').trim(); $('titleText').textContent = t; }
  function openSheet(){ syncSheet(); sheet.hidden = false; setTimeout(function(){ try { $('titleInput').focus({ preventScroll:true }); } catch (e) {} }, 0); }
  function closeSheet(){ if (settings.cats.length === 0) { $('catErr').hidden = false; return; } sheet.hidden = true; $('openSheet').focus({ preventScroll:true }); }

  $('titleInput').addEventListener('input', function(e){ settings.title = e.target.value; syncTitle(); save(); });
  document.querySelectorAll('[data-os]').forEach(function(b){
    b.addEventListener('click', function(){ settings.os = b.dataset.os; syncSheet(); save(); render(true); });
  });
  $('byttSelect').addEventListener('change', function(e){ settings.bytt = parseInt(e.target.value, 10) || 0; offset = 0; save(); render(true); });
  $('allCats').addEventListener('click', function(){ settings.cats = CATS.map(function(c){ return c[0]; }); syncSheet(); readCats(); });
  $('noCats').addEventListener('click', function(){ settings.cats = []; syncSheet(); readCats(); });
  sheet.addEventListener('submit', function(e){ e.preventDefault(); closeSheet(); });
  $('closeSheet').addEventListener('click', closeSheet);

  /* ---------- Knapper og tastatur ---------- */
  function barClick(fn){ return function(e){ fn(); if (e.detail > 0 && e.currentTarget && e.currentTarget.blur) e.currentTarget.blur(); }; }
  $('prevBtn').addEventListener('click', barClick(function(){ step(-1); }));
  $('nextBtn').addEventListener('click', barClick(function(){ step(1); }));
  $('randBtn').addEventListener('click', barClick(random));
  $('openSheet').addEventListener('click', openSheet);
  $('backBtn').addEventListener('click', backToToday);

  window.addEventListener('keydown', function(e){
    if (e.ctrlKey || e.metaKey || e.altKey) return;
    if (!sheet.hidden) { if (e.key === 'Escape') { e.preventDefault(); closeSheet(); } return; }
    var tag = e.target && e.target.tagName;
    if (tag === 'INPUT' || tag === 'SELECT' || tag === 'TEXTAREA') return;
    if (e.key === 'ArrowLeft') { e.preventDefault(); step(-1); }
    else if (e.key === 'ArrowRight') { e.preventDefault(); step(1); }
    else if (e.key === 'r' || e.key === 'R') { e.preventDefault(); random(); }
  });

  /* ---------- Skjul kontrollene når musa er i ro eller utenfor ---------- */
  var hideT = null, overBar = false;
  function pokeUI(){
    app.classList.remove('hide-ui');
    clearTimeout(hideT);
    hideT = setTimeout(function(){ if (!overBar && sheet.hidden) app.classList.add('hide-ui'); }, 2500);
  }
  ['pointermove', 'pointerdown', 'keydown', 'touchstart'].forEach(function(ev){ window.addEventListener(ev, pokeUI, { passive:true }); });
  document.documentElement.addEventListener('mouseleave', function(){
    overBar = false; clearTimeout(hideT);
    hideT = setTimeout(function(){ if (sheet.hidden) app.classList.add('hide-ui'); }, 600);
  });
  bar.addEventListener('pointerenter', function(){ overBar = true; });
  bar.addEventListener('pointerleave', function(){ overBar = false; pokeUI(); });

  /* ---------- Start ---------- */
  syncTitle();
  render(true);
  pokeUI();
  setInterval(function(){ render(); }, 1000); // bytter tips ved midnatt eller når intervallet er ute
})();
</script>
</body>
